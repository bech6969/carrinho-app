name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Chave de assinatura fixa
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret KEYSTORE_B64 não configurado"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/carrinho.jks"
      - name: Compilar APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/carrinho.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleDebug --stacktrace
      - name: Preparar release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Carrinho.apk
          NOTAS=$(git log -1 --pretty=%s | tr -d '"\\')
          printf '{"versionCode": %s, "versionName": "1.%s", "notas": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$NOTAS" > versao.json
          cat versao.json
      - name: Publicar release (o app baixa daqui)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão 1.${{ github.run_number }}
          files: |
            Carrinho.apk
            versao.json
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: carrinho-apk
          path: Carrinho.apk
